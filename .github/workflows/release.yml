name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, for example 0.1.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rayvia-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            $version = $override.Trim().TrimStart("v")
          } else {
            [xml]$project = Get-Content "src/Rayvia/Rayvia.csproj"
            $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve application version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "Rayvia-Release"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists."
          } elseif ($response.StatusCode -eq 404) {
            "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "GitHub release lookup failed with HTTP $($response.StatusCode)."
          }

      - name: Setup .NET
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet publish src/Rayvia/Rayvia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Install Inno Setup
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DPublishDir=$((Resolve-Path publish).Path)" `
            installer/Rayvia.iss

      - name: Checksums
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Rayvia-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rayvia-Setup-x64.exe" | Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            artifacts/Rayvia-Setup-x64.exe `
            artifacts/SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Rayvia ${{ steps.version.outputs.version }}" `
            --generate-notes
