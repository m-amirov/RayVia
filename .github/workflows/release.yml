name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, for example 0.1.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rayvia-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            $version = $override.Trim().TrimStart("v")
          } else {
            [xml]$project = Get-Content "src/Rayvia/Rayvia.csproj"
            $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve application version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release ${{ steps.version.outputs.tag }} already exists."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release ${{ steps.version.outputs.tag }} will be created."
          }

          # gh returns exit code 1 when a release does not exist. That is expected here.
          exit 0

      - name: Setup .NET
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.existing.outputs.skip != 'true'
        run: dotnet restore src/Rayvia/Rayvia.csproj

      - name: Restore tests
        if: steps.existing.outputs.skip != 'true'
        run: dotnet restore tests/Rayvia.Tests/Rayvia.Tests.csproj

      - name: Build
        if: steps.existing.outputs.skip != 'true'
        run: dotnet build src/Rayvia/Rayvia.csproj -c Release --no-restore

      - name: Build tests
        if: steps.existing.outputs.skip != 'true'
        run: dotnet build tests/Rayvia.Tests/Rayvia.Tests.csproj -c Release --no-restore

      - name: Test
        if: steps.existing.outputs.skip != 'true'
        run: dotnet test tests/Rayvia.Tests/Rayvia.Tests.csproj -c Release --no-build --no-restore

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet publish src/Rayvia/Rayvia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Install Inno Setup
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DPublishDir=$((Resolve-Path publish).Path)" `
            installer/Rayvia.iss

      - name: Release gate
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path publish\Rayvia.exe)) { throw "Publish output is missing." }
          if (-not (Test-Path artifacts\Rayvia-Setup-x64.exe)) { throw "Installer output is missing." }

      - name: Checksums
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Rayvia-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rayvia-Setup-x64.exe" | Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = if ($env:GITHUB_EVENT_NAME -eq "workflow_run") { "${{ github.event.workflow_run.head_sha }}" } else { "${{ github.sha }}" }
          gh release create "${{ steps.version.outputs.tag }}" `
            artifacts/Rayvia-Setup-x64.exe `
            artifacts/SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --target $target `
            --title "Rayvia ${{ steps.version.outputs.version }}" `
            --generate-notes
