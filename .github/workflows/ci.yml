name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/Rayvia/Rayvia.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/Rayvia/Rayvia.csproj

      - name: Build
        run: dotnet build src/Rayvia/Rayvia.csproj -c Release --no-restore

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish src/Rayvia/Rayvia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DPublishDir=$((Resolve-Path publish).Path)" `
            installer/Rayvia.iss
