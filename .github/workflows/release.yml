name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Rayvia/Rayvia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DPublishDir=$((Resolve-Path publish).Path)" `
            installer/Rayvia.iss

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Rayvia-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rayvia-Setup-x64.exe" | Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            "release", "create", "${{ steps.version.outputs.tag }}",
            "artifacts/Rayvia-Setup-x64.exe",
            "artifacts/SHA256SUMS.txt",
            "--title", "Rayvia ${{ steps.version.outputs.version }}",
            "--generate-notes"
          )
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ghArgs += @("--target", "${{ github.sha }}")
          }
          gh @ghArgs
